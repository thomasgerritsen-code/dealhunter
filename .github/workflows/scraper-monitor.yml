name: DealHunter HTML scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scraper-monitor.yml'
      - 'dealhunter/html_scraper.py'
      - 'dealhunter/engine.py'
      - 'config/scraper_searches.json'
  schedule:
    - cron: '4-59/10 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dealhunter-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run recognition tests
        run: python -m pytest -q
      - name: Scrape public Marktplaats search pages
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          SEND_WHATSAPP: 'true'
        run: python -m dealhunter.html_scraper
      - name: Save dashboard data to repository
        run: |
          git config user.name "dealhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the freshly generated data, then move to the latest main.
          # This prevents a concurrent source-code commit from causing a rebase
          # conflict in state.json/results.json.
          mkdir -p /tmp/dealhunter-data
          cp docs/data/*.json /tmp/dealhunter-data/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/dealhunter-data/*.json docs/data/

          git add docs/data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update scraper data"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
