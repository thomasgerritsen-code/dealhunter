name: DealHunter saved-search monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealhunter-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check saved-search alerts and feeds
        env:
          DEALHUNTER_RSS_URLS: ${{ secrets.DEALHUNTER_RSS_URLS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          IMAP_SENDER_DOMAINS: ${{ secrets.IMAP_SENDER_DOMAINS }}
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          SEND_WHATSAPP: 'true'
        run: python -m dealhunter.saved_search_monitor
      - name: Publish dashboard state
        run: |
          git config user.name "dealhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update saved-search data"
            git pull --rebase origin main
            git push
          fi
