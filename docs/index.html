<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DealHunter</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#090d12;color:#eef3f7}*{box-sizing:border-box}body{margin:0;background:#090d12}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:sticky;top:0;height:100vh;border-right:1px solid #202d38;background:#0d141c;padding:22px 14px}.brand{padding:4px 10px 24px}.brand small{color:#7890a4;text-transform:uppercase;letter-spacing:.15em}.brand b{display:block;font-size:1.7rem;margin-top:4px}.nav{display:grid;gap:5px}.nav a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:#aebdca;padding:11px 12px;border-radius:10px}.nav a:hover,.nav a.active{background:#17222d;color:#fff}.count{background:#22313e;border-radius:999px;padding:1px 7px;font-size:.72rem;min-width:25px;text-align:center}.main{min-width:0;padding:26px clamp(14px,3vw,38px) 70px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0}.sub{color:#91a4b4;margin-top:7px;max-width:760px}.scanstatus{border:1px solid #263746;background:#101923;border-radius:13px;padding:11px 14px;color:#aab9c5;font-size:.84rem;white-space:nowrap}.okdot,.baddot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.okdot{background:#6de398}.baddot{background:#ef9b77}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}.stat{border:1px solid #22323f;background:#101923;border-radius:14px;padding:14px}.stat small{color:#7f94a5}.stat strong{display:block;font-size:1.65rem;margin-top:4px}.panel{border:1px solid #22323f;background:#101923;border-radius:16px;padding:17px;margin-bottom:16px}.panel h2{margin:0 0 6px;font-size:1.25rem}.muted{color:#8398a9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-block;border:1px solid #314452;background:#182631;color:#eaf1f6;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:700}.btn.primary{background:#edf3f7;color:#0c1319;border-color:#edf3f7}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 190px 190px;gap:9px;margin-bottom:12px}.input,.select{width:100%;border:1px solid #2b3b48;background:#0c141c;color:#eef3f7;border-radius:10px;padding:10px 11px;font:inherit}.tablewrap{overflow:auto;border:1px solid #22323f;border-radius:14px;background:#0d151d}table{border-collapse:collapse;width:100%;min-width:1030px}th{position:sticky;top:0;background:#121d27;color:#7890a3;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:10px 11px;border-bottom:1px solid #23333f}td{padding:11px;border-bottom:1px solid #1d2a34;vertical-align:top}.title{font-weight:750;max-width:360px}.small{font-size:.79rem;color:#8396a5;margin-top:3px}.num{white-space:nowrap}.green{color:#75e6a0}.red{color:#ee9999}.badge{display:inline-block;border-radius:999px;background:#1d2b36;color:#b8c7d2;padding:4px 8px;font-size:.74rem;white-space:nowrap}.badge.deal{background:#133825;color:#8ff0b1}.badge.warn{background:#392f18;color:#efd395}.badge.bad{background:#3a2028;color:#e9a7ba}.badge.out{background:#302b38;color:#cbb6ed}.open{display:inline-block;background:#edf3f7;color:#0c1319;text-decoration:none;font-weight:750;border-radius:8px;padding:7px 9px;white-space:nowrap}.empty{text-align:center;padding:45px;color:#7f93a3}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.card{border:1px solid #22323f;background:#0c151d;border-radius:14px;padding:14px}.cardtop{display:flex;justify-content:space-between;gap:10px}.card h3{margin:11px 0 4px;font-size:1rem}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.metric{background:#091118;border-radius:9px;padding:8px}.metric small{color:#7890a2;display:block}.metric b{display:block;margin-top:2px}.searchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.searchitem{border:1px solid #233541;background:#0b141c;border-radius:13px;padding:13px}.searchitem b{display:block}.searchitem .btn{margin-top:9px}.kv{display:grid;grid-template-columns:190px 1fr;gap:8px 16px;margin-top:14px}.kv div:nth-child(odd){color:#8297a8}.notice{border:1px solid #4c3f27;background:#241e14;color:#ead09a;border-radius:11px;padding:10px 12px;margin-bottom:14px}.mobileNav{display:none;overflow:auto;gap:6px;margin-bottom:15px}.mobileNav a{white-space:nowrap;text-decoration:none;color:#b5c3ce;border:1px solid #283845;border-radius:999px;padding:8px 11px}.mobileNav a.active{background:#edf3f7;color:#0c1319}.mobileCards{display:none}@media(max-width:960px){.app{display:block}.side{display:none}.mobileNav{display:flex}.stats{grid-template-columns:repeat(3,1fr)}.head{display:block}.scanstatus{display:inline-block;margin-top:13px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}.tablewrap{display:none}.mobileCards{display:block}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.main{padding:18px 11px 55px}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){font-weight:700;margin-top:7px}}
</style>
</head>
<body><div class="app">
<aside class="side"><div class="brand"><small>Marktplaats monitor</small><b>DealHunter</b></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="mobileNav" id="mobileNav"></div><div class="head"><div><h1 id="pageTitle">Overzicht</h1><div class="sub" id="pageSub">Nieuwe Marktplaats-resultaten, gescoord op geschatte marge, ROI en risico.</div></div><div class="scanstatus" id="scanStatus">Laden…</div></div><div id="content"></div></main>
</div>
<script>
let results=[],status={},searches=[],view='overview';
const actionUrl='https://github.com/thomasgerritsen-code/dealhunter/actions/workflows/scraper-monitor.yml';
const euro=n=>n==null?'—':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'short'}):'—';
const scored=()=>results.filter(r=>r.analysis&&r.result_status!=='excluded');
const deals=()=>results.filter(r=>r.is_deal);
const opportunities=()=>scored().slice().sort((a,b)=>(b.analysis?.deal_score||0)-(a.analysis?.deal_score||0));
const excluded=()=>results.filter(r=>r.result_status==='excluded');
const unpriced=()=>results.filter(r=>r.result_status==='unpriced');
const unrecognized=()=>results.filter(r=>r.result_status==='unrecognized');
const bestScore=()=>Math.max(0,...scored().map(r=>r.analysis?.deal_score||0));
function navDefs(){return [['overview','Overzicht',''],['deals','Deals',deals().length],['opportunities','Kansen',scored().length],['results','Alle resultaten',results.length],['unpriced','Geen prijs',unpriced().length],['unrecognized','Niet herkend',unrecognized().length],['excluded','Uitgesloten',excluded().length],['searches','Zoekopdrachten',searches.length],['scanner','Scanner','']]}
function nav(){const html=navDefs().map(([k,l,c])=>`<a href="#${k}" class="${view===k?'active':''}"><span>${l}</span>${c!==''?`<span class="count">${c}</span>`:''}</a>`).join('');document.querySelector('#nav').innerHTML=html;document.querySelector('#mobileNav').innerHTML=html}
function setTitles(){const map={overview:['Overzicht','Wat de scanner tot nu toe heeft gevonden.'],deals:['Deals','Alleen resultaten boven jouw ingestelde Deal Score-, winst- en ROI-drempel.'],opportunities:['Kansen','Alle herkende producten, van hoogste naar laagste Deal Score.'],results:['Alle resultaten','De volledige vangst van de scraper, ook niet-herkende en uitgesloten advertenties.'],unpriced:['Geen prijs','Advertenties met Bieden/Zie omschrijving of een prijs die niet betrouwbaar kon worden gelezen.'],unrecognized:['Niet herkend','Advertenties die nog niet aan een product uit de DealHunter-catalogus gekoppeld konden worden.'],excluded:['Uitgesloten','Accessoires, diensten en andere resultaten die bewust niet als hoofdproduct worden gewaardeerd.'],searches:['Zoekopdrachten','De zoekopdrachten die DealHunter automatisch controleert.'],scanner:['Scannerstatus','Technische status van de laatste Marktplaats-scan.']};const [a,b]=map[view]||map.overview;document.querySelector('#pageTitle').textContent=a;document.querySelector('#pageSub').textContent=b}
function badge(r){if(r.is_deal)return '<span class="badge deal">DEAL</span>';if(r.result_status==='scored')return '<span class="badge">Gescoord</span>';if(r.result_status==='unpriced')return '<span class="badge warn">Geen prijs</span>';if(r.result_status==='unrecognized')return '<span class="badge bad">Niet herkend</span>';if(r.result_status==='excluded')return '<span class="badge out">Uitgesloten</span>';return `<span class="badge">${esc(r.result_status||'nieuw')}</span>`}
function statsHtml(){return `<div class="stats"><div class="stat"><small>Resultaten</small><strong>${results.length}</strong></div><div class="stat"><small>Deals</small><strong>${deals().length}</strong></div><div class="stat"><small>Gescoord</small><strong>${scored().length}</strong></div><div class="stat"><small>Geen prijs</small><strong>${unpriced().length}</strong></div><div class="stat"><small>Beste score</small><strong>${bestScore()?bestScore()+'/100':'—'}</strong></div></div>`}
function card(r){const a=r.analysis||{};return `<article class="card"><div class="cardtop">${badge(r)}<b>${a.deal_score!=null?a.deal_score+'/100':'—'}</b></div><h3>${esc(r.title)}</h3><div class="small">${esc(r.matched_product||r.query||'Niet herkend')}</div><div class="metrics"><div class="metric"><small>Vraagprijs</small><b>${euro(r.asking_price)}</b></div><div class="metric"><small>Waarde</small><b>${euro(a.expected_resale)}</b></div><div class="metric"><small>Winst</small><b class="${a.expected_profit>0?'green':a.expected_profit<0?'red':''}">${euro(a.expected_profit)}</b></div><div class="metric"><small>ROI</small><b>${a.roi_percent!=null?Math.round(a.roi_percent)+'%':'—'}</b></div></div>${r.exclusion_reason?`<div class="small">${esc(r.exclusion_reason)}</div>`:''}${r.url?`<div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${encodeURI(r.url)}">Open advertentie →</a></div>`:''}</article>`}
function overview(){const top=opportunities().slice(0,6);const notice=status.errors?.length?`<div class="notice">Laatste scan bevat ${status.errors.length} foutmelding(en).</div>`:'';return `${statsHtml()}${notice}<div class="panel"><h2>Beste kansen nu</h2><div class="muted">Dit zijn de hoogst gescoorde herkende advertenties. Een kans hoeft niet automatisch een Deal te zijn.</div><div class="actions"><a class="btn primary" href="#opportunities">Bekijk alle kansen</a><a class="btn" href="#results">Bekijk alle resultaten</a><a class="btn" target="_blank" href="${actionUrl}">Start handmatige scan ↗</a></div></div><div class="cards">${top.length?top.map(card).join(''):'<div class="panel muted">Nog geen herkende kansen.</div>'}</div>`}
function filteredRows(base){const q=(document.querySelector('#q')?.value||'').toLowerCase(),cat=document.querySelector('#cat')?.value||'Alles',sort=document.querySelector('#sort')?.value||'newest';let rows=base.filter(r=>!q||[r.title,r.matched_product,r.query,r.description,r.exclusion_reason].some(v=>String(v||'').toLowerCase().includes(q)));if(cat!=='Alles')rows=rows.filter(r=>(r.analysis?.category||r.category_hint)===cat);rows=[...rows];if(sort==='score')rows.sort((a,b)=>(b.analysis?.deal_score??-1)-(a.analysis?.deal_score??-1));else if(sort==='profit')rows.sort((a,b)=>(b.analysis?.expected_profit??-999999)-(a.analysis?.expected_profit??-999999));else if(sort==='price')rows.sort((a,b)=>(a.asking_price??9999999)-(b.asking_price??9999999));else rows.sort((a,b)=>String(b.found_at||'').localeCompare(String(a.found_at||'')));return rows}
function tableView(base){const cats=[...new Set(results.map(r=>r.analysis?.category||r.category_hint).filter(Boolean))].sort();const tools=`<div class="toolbar"><input class="input" id="q" placeholder="Zoek in resultaten…"><select class="select" id="cat"><option>Alles</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select class="select" id="sort"><option value="newest">Nieuwste eerst</option><option value="score">Hoogste score</option><option value="profit">Hoogste winst</option><option value="price">Laagste prijs</option></select></div><div id="rows"></div>`;setTimeout(()=>{['q','cat','sort'].forEach(id=>document.querySelector('#'+id)?.addEventListener(id==='q'?'input':'change',()=>renderRows(base)));renderRows(base)},0);return tools}
function renderRows(base){const rows=filteredRows(base),target=document.querySelector('#rows');if(!target)return;if(!rows.length){target.innerHTML='<div class="panel empty">Geen resultaten in deze selectie.</div>';return}const tr=rows.map(r=>{const a=r.analysis||{},p=a.expected_profit;return `<tr><td class="num">${esc(dt(r.found_at))}<div class="small">${esc(r.query||'')}</div></td><td><div class="title">${esc(r.title)}</div><div class="small">${esc(r.matched_product||r.exclusion_reason||'Niet automatisch herkend')}</div></td><td>${badge(r)}</td><td class="num">${euro(r.asking_price)}</td><td class="num">${euro(a.expected_resale)}</td><td class="num ${p>0?'green':p<0?'red':''}">${euro(p)}</td><td class="num">${a.roi_percent!=null?Math.round(a.roi_percent)+'%':'—'}</td><td class="num"><b>${a.deal_score!=null?a.deal_score+'/100':'—'}</b></td><td>${r.url?`<a class="open" target="_blank" rel="noopener" href="${encodeURI(r.url)}">Open →</a>`:''}</td></tr>`}).join('');target.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Gevonden</th><th>Advertentie</th><th>Status</th><th>Prijs</th><th>Waarde</th><th>Winst</th><th>ROI</th><th>Score</th><th></th></tr></thead><tbody>${tr}</tbody></table></div><div class="mobileCards">${rows.map(card).join('')}</div><div class="small" style="margin-top:9px">${rows.length} resultaten zichtbaar</div>`}
function searchesView(){return `<div class="panel"><h2>${searches.length} actieve zoekopdrachten</h2><div class="muted">Iedere automatische run controleert de nieuwste resultaten van deze zoektermen.</div><div class="actions"><a class="btn primary" target="_blank" href="${actionUrl}">Open scanner in GitHub ↗</a></div></div><div class="searchgrid">${searches.map(s=>`<div class="searchitem"><b>${esc(s.name||s.query)}</b><div class="small">${esc(s.category||'')} · zoekterm: ${esc(s.query)}</div><a class="btn" target="_blank" rel="noopener" href="https://www.marktplaats.nl/q/${encodeURIComponent(s.query)}/?sortBy=SORT_INDEX&sortOrder=DECREASING">Bekijk op Marktplaats →</a></div>`).join('')}</div>`}
function scannerView(){const errs=status.errors||[];return `<div class="panel"><h2>Laatste scraper-run</h2><div class="kv"><div>Modus</div><div>${esc(status.mode||'—')}</div><div>Laatste check</div><div>${esc(dt(status.last_checked))}</div><div>Zoekopdrachten</div><div>${status.queries_configured??'—'}</div><div>Links opgehaald</div><div>${status.links_fetched??0}</div><div>Advertenties gecontroleerd</div><div>${status.checked_ads??0}</div><div>Nieuwe resultaten</div><div>${status.new_results_saved??0}</div><div>Deals</div><div>${status.new_deals??0}</div><div>Uitgesloten</div><div>${status.excluded_results??0}</div><div>WhatsApp</div><div>${status.whatsapp_enabled?'Actief':'Nog niet ingesteld'}</div></div><div class="actions"><a class="btn primary" target="_blank" href="${actionUrl}">GitHub Actions openen ↗</a></div></div>${errs.length?`<div class="notice"><b>Fouten laatste run</b><br>${errs.map(esc).join('<br>')}</div>`:'<div class="panel"><span class="badge deal">Geen fouten</span> De laatste scan is technisch succesvol uitgevoerd.</div>'}`}
function render(){nav();setTitles();let html='';if(view==='overview')html=overview();else if(view==='deals')html=tableView(deals());else if(view==='opportunities')html=tableView(opportunities());else if(view==='results')html=tableView(results);else if(view==='unpriced')html=tableView(unpriced());else if(view==='unrecognized')html=tableView(unrecognized());else if(view==='excluded')html=tableView(excluded());else if(view==='searches')html=searchesView();else if(view==='scanner')html=scannerView();document.querySelector('#content').innerHTML=html}
async function load(){const stamp=Date.now();try{const [r,s,c]=await Promise.all([fetch('./data/results.json?'+stamp).then(x=>x.ok?x.json():[]),fetch('./data/status.json?'+stamp).then(x=>x.ok?x.json():{}),fetch('./data/scraper_searches.json?'+stamp).then(x=>x.ok?x.json():{searches:[]})]);results=Array.isArray(r)?r:[];status=s||{};searches=Array.isArray(c.searches)?c.searches:[];const good=!status.errors?.length&&status.mode==='marktplaats-html-scraper';document.querySelector('#scanStatus').innerHTML=`<span class="${good?'okdot':'baddot'}"></span>${good?'Scanner actief':'Controle nodig'} · ${status.links_fetched??0} links`;render()}catch(e){document.querySelector('#scanStatus').innerHTML='<span class="baddot"></span>Data kon niet laden'}}
function route(){const wanted=(location.hash||'#overview').slice(1);view=navDefs().some(x=>x[0]===wanted)?wanted:'overview';render()}
window.addEventListener('hashchange',route);load().then(route);setInterval(load,60000);
</script></body></html>
