<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DealHunter AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0f14;color:#eef3f8}*{box-sizing:border-box}body{margin:0;background:#0b0f14}.wrap{max-width:1050px;margin:auto;padding:24px 16px 64px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.18em;color:#91a8bc}h1{font-size:clamp(2.2rem,8vw,4rem);margin:6px 0}.sub{color:#9fb0bf;max-width:650px}.status{border:1px solid #263544;background:#101821;border-radius:14px;padding:12px 14px;color:#aec0cf;font-size:.88rem}.status strong{color:#eef3f8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid #2c3b49;background:#111a23;color:#dce7ef;border-radius:999px;padding:9px 13px}.pill.active{background:#eef5fa;color:#10151a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.card{border:1px solid #263544;background:#121b25;border-radius:18px;padding:17px}.top{display:flex;justify-content:space-between;gap:12px}.score{font-weight:800;font-size:1.2rem;color:#78f0a4}.name{font-weight:750;margin:13px 0 4px}.match{color:#8fa3b3;font-size:.85rem}.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.num{background:#0a1117;border-radius:12px;padding:10px}.num small{display:block;color:#8296a6}.profit{color:#78f0a4}.meta{display:flex;gap:7px;flex-wrap:wrap;font-size:.78rem;color:#9fb0bf}.badge{background:#1a2631;border-radius:999px;padding:5px 8px}.open{display:block;text-align:center;text-decoration:none;background:#eef5fa;color:#0d141a;font-weight:750;border-radius:11px;padding:11px;margin-top:15px}.empty{padding:45px 10px;text-align:center;color:#8296a6}.warn{margin-bottom:18px;border:1px solid #4a3b23;background:#231d13;color:#f4d89b;border-radius:12px;padding:11px 13px}.ok{margin-bottom:18px;border:1px solid #244234;background:#102119;color:#a9e9bf;border-radius:12px;padding:11px 13px}@media(max-width:650px){header{display:block}.status{margin-top:14px;display:inline-block}}
</style>
</head>
<body><div class="wrap">
<header><div><div class="eyebrow">AI arbitrage scanner</div><h1>DealHunter</h1><div class="sub">Nieuwe meldingen → productherkenning → marktwaarde → Deal Score → WhatsApp. Controleer altijd de originele advertentie voordat je koopt.</div></div><div class="status" id="status">Status laden…</div></header>
<div id="warning"></div><div class="controls" id="controls"></div><div class="grid" id="grid"><div class="empty">Deals laden…</div></div>
</div>
<script>
let deals=[],filter='Alles';const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function cats(){return ['Alles',...new Set(deals.map(d=>d.analysis?.category).filter(Boolean))]}
function controls(){const e=document.querySelector('#controls');e.innerHTML=cats().map(c=>`<button class="pill ${c===filter?'active':''}" data-c="${c}">${c}</button>`).join('');e.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.c;controls();render()})}
function render(){const rows=filter==='Alles'?deals:deals.filter(d=>d.analysis?.category===filter),e=document.querySelector('#grid');if(!rows.length){e.innerHTML='<div class="empty">Nog geen deals boven de ingestelde drempel.</div>';return}e.innerHTML=rows.map(d=>{const a=d.analysis||{};return `<article class="card"><div class="top"><span class="badge">${esc(a.category)}</span><span class="score">${a.deal_score||0}/100</span></div><div class="name">${esc(d.title)}</div><div class="match">${esc(d.matched_product)}</div><div class="nums"><div class="num"><small>Vraagprijs</small><strong>${euro(d.asking_price)}</strong></div><div class="num"><small>Waarde</small><strong>${euro(a.expected_resale)}</strong></div><div class="num"><small>Winst</small><strong class="profit">${euro(a.expected_profit)}</strong></div><div class="num"><small>ROI</small><strong>${Math.round(a.roi_percent||0)}%</strong></div></div><div class="meta"><span class="badge">Risico ${a.risk_score}/100</span><span class="badge">${esc(a.verdict)}</span><span class="badge">${a.valuation_samples||0} prijsrefs</span>${d.source?`<span class="badge">${esc(d.source)}</span>`:''}</div>${d.url?`<a class="open" href="${encodeURI(d.url)}" target="_blank" rel="noopener">Bekijk advertentie →</a>`:''}</article>`}).join('')}
Promise.all([fetch('./data/deals.json?'+Date.now()).then(r=>r.json()),fetch('./data/status.json?'+Date.now()).then(r=>r.json())]).then(([d,s])=>{deals=d;const when=s.last_checked?new Date(s.last_checked).toLocaleString('nl-NL'):'nog niet';const src=s.configured_sources?Object.entries(s.configured_sources).filter(([,v])=>v).map(([k])=>k.toUpperCase()).join(' + '):'';document.querySelector('#status').innerHTML=`<strong>${esc(s.mode||'scanner')}</strong><br>Laatste check: ${esc(when)}${src?`<br>Bron: ${esc(src)}`:''}`;if(s.errors?.length){document.querySelector('#warning').innerHTML=`<div class="warn">Laatste scan bevat ${s.errors.length} foutmelding(en). Bekijk Actions voor details.</div>`}else if(s.mode==='saved-search-monitor'&&!src){document.querySelector('#warning').innerHTML='<div class="warn">Saved-search monitor staat klaar, maar er is nog geen mailbox of RSS-feed gekoppeld.</div>'}else if(s.mode==='saved-search-monitor'){document.querySelector('#warning').innerHTML=`<div class="ok">Monitor actief. Nieuwe bronitems: ${s.new_source_items||0}. Nog niet automatisch te prijzen: ${s.unscored_candidates||0}.</div>`}controls();render()}).catch(()=>document.querySelector('#grid').innerHTML='<div class="empty">Kon data niet laden.</div>')
</script></body></html>
